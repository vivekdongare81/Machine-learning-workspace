[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-ml"
version = "0.2.0"
description = "Time-aware fraud risk scoring: config-driven training, batch scoring and an online API"
readme = "README.md"
requires-python = ">=3.10"
# Abstract (ranged) dependencies. Exact versions live in requirements*.lock (`make lock`).
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
  "pyyaml>=6.0,<7",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]
tracking = ["mlflow>=2.14"]

[project.scripts]
fraud-train = "fraud_ml.train:main"
fraud-score-batch = "fraud_ml.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = [
  # NumPy 2.x + Apple Accelerate BLAS emits spurious matmul warnings on finite data.
  "ignore:.*encountered in matmul:RuntimeWarning",
]

[tool.coverage.run]
source = ["fraud_ml"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
